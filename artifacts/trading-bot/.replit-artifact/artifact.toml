kind = "web"
previewPath = "/"
title = "AI Trading Bot"
description = "A personal AI-powered intraday stock trading bot dashboard for the Indian stock market. Monitors live prices via Upstox API, generates buy signals using technical indicators (EMA, VWAP, ATR, support/resistance), manages positions with automatic stop-loss and trailing stops, and enforces strict daily risk limits. Includes paper trading / sandbox mode for safe testing before live trading."
version = "1.0.0"
id = "artifacts/trading-bot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20883

[services.development]
run = "pnpm --filter @workspace/trading-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trading-bot", "run", "build" ]
serve = "static"
publicDir = "artifacts/trading-bot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20883"
BASE_PATH = "/"
